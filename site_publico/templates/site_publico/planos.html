<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f8fafc; color: #1e293b; }
        .wrap { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
        .card { background: #fff; border-radius: 18px; padding: 24px; box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08); }
        .button { display: inline-block; padding: 10px 16px; background: #0f766e; color: #fff; text-decoration: none; border-radius: 999px; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Planos</h1>
        <p>Escolha um plano e siga para o onboarding da assinatura.</p>
        <div class="grid">
            {% for plano in planos %}
            <div class="card">
                <h2>{{ plano.nome }}</h2>
                <p><strong>R$ {{ plano.valor_mensal }}/mes</strong></p>
                <p>{{ plano.descricao }}</p>
                <a class="button" href="{% url 'billing:iniciar_assinatura' plano.id %}">Assinar</a>
            </div>
            {% empty %}
            <div class="card">
                <p>Nenhum plano cadastrado ainda.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
