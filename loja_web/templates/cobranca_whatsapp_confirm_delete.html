{% extends 'base.html' %}

{% block title %}Excluir Regra de Cobrança{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Excluir Regra de Cobrança WhatsApp</h2>
    <p>Tem certeza que deseja excluir a regra "<strong>{{ regra.nome }}</strong>"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmar Exclusão</button>
        <a href="{% url 'lista_regras_cobranca_whatsapp' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
