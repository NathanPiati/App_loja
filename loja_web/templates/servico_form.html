{% extends 'base_servicos.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2><i class="bi bi-tools"></i> {{ title }}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_nome" class="form-label">Nome</label>
            {{ form.nome|add_class:"form-control" }}
        </div>
        <div class="mb-3">
            <label for="id_preco" class="form-label">Preço (R$)</label>
            {{ form.preco|add_class:"form-control" }}
        </div>
        <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Salvar</button>
        <a href="{% url 'servico_lista' %}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Voltar</a>
    </form>
</div>
{% endblock %}
