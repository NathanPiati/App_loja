<div class="modal fade" id="modalProduto" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title text-dark">Selecionar Produto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="text" id="buscaProduto" class="form-control mb-3" placeholder="Buscar produto...">
        <div id="loadingBuscaProduto" class="text-center mb-2" style="display: none;">
          <div class="spinner-border text-primary" role="status"></div>
        </div>
        <table class="table table-sm table-bordered">
          <thead>
            <tr>
              <th>ID</th>
              <th>Produto</th>
              <th>Preço</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody id="resultadoBuscaProduto"></tbody>
        </table>
        <div class="mt-2 text-dark">
          <label>Quantidade:</label>
          <input type="number" id="quantidadeProduto" class="form-control" value="1" min="1">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
      </div>
    </div>
  </div>
</div>
